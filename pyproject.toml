[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brushstroke"
version = "0.1.0"
description = "Neural stroke-based painting with semantic-aware stroke allocation and painterly ordering."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
# Runtime pins live in requirements.txt (torch needs a custom index, so it is not listed here).
dependencies = []

[tool.setuptools.packages.find]
include = ["brushstroke*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint.per-file-ignores]
"scripts/exp_optim_sweep.py" = ["E501"]  # long table-header strings
"scripts/make_m1_demos.py" = ["E501"]  # long table-header strings
"scripts/pt_reference_study.py" = ["E501"]  # pinned checksums and long docstring lines
"scripts/pt_inference_study.py" = ["E501"]  # long table-header strings

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["brushstroke"]

[[tool.mypy.overrides]]
module = ["lpips", "lpips.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: test requires a CUDA device (auto-skipped otherwise)",
    "slow: slow test, excluded from the default CI run",
]
