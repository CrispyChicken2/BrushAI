[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brushstroke"
version = "0.1.0"
description = "Neural stroke-based painting with semantic-aware stroke allocation and painterly ordering."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
# Runtime pins live in requirements.txt (torch needs a custom index, so it is not listed here).
dependencies = []

[tool.setuptools.packages.find]
include = ["brushstroke*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint.per-file-ignores]
"scripts/exp_optim_sweep.py" = ["E501"]  # long table-header strings
"scripts/make_m1_demos.py" = ["E501"]  # long table-header strings
"scripts/pt_reference_study.py" = ["E501"]  # pinned checksums and long docstring lines
"scripts/pt_inference_study.py" = ["E501"]  # long table-header strings
"scripts/exp_pt_table1.py" = ["E501"]  # long table strings
"scripts/exp_pt_instability.py" = ["E501"]  # long docstring and table lines
"scripts/build_eval_set.py" = ["E501"]  # long docstring and table lines
"scripts/generate_eval_sdxl.py" = ["E501"]  # long docstring lines
"scripts/fetch_eval_set.py" = ["E501"]  # long docstring lines
"scripts/audit_eval_set.py" = ["E501"]  # long docstring and message lines
"scripts/fetch_inspyrenet.py" = ["E501"]  # long docstring lines
"scripts/compute_saliency.py" = ["E501"]  # long docstring and table lines
"brushstroke/eval/saliency.py" = ["E501"]  # long docstring lines (paper references)
"brushstroke/eval/curves.py" = ["E501"]  # long docstring lines (protocol references)
"brushstroke/renderer/rasterize.py" = ["E501"]  # long docstring lines (derivations)
"brushstroke/renderer/pipeline.py" = ["E501"]  # long docstring lines
"tests/test_eval_runner.py" = ["E501"]  # long assertions
"tests/test_renderer_bbox.py" = ["E501"]  # long comments
"brushstroke/eval/metrics.py" = ["E501"]  # long docstring lines (protocol references)
"brushstroke/eval/stats.py" = ["E501"]  # long docstring lines (protocol references)
"brushstroke/eval/producers.py" = ["E501"]  # long docstring lines (protocol references)
"brushstroke/eval/runner.py" = ["E501"]  # long docstring lines (protocol references)
"brushstroke/eval/report.py" = ["E501"]  # long docstring and table lines
"brushstroke/eval/protocol.py" = ["E501"]  # long docstring lines
"scripts/eval_run.py" = ["E501"]  # long docstring and table lines
"scripts/exp_pt_table2.py" = ["E501"]  # long table strings
"scripts/exp_pt_ablation_verdict.py" = ["E501"]  # long table strings
"scripts/make_m2_demos.py" = ["E501"]  # long table strings
"scripts/exp_pt_bn_validation.py" = ["E501"]  # long table strings
"scripts/exp_pt_paper_weights.py" = ["E501"]  # long table strings
"scripts/exp_pt_figures.py" = ["E501"]  # long docstring lines
"scripts/pt_repro_common.py" = ["E501"]  # paper numbers
"scripts/exp_pt_convention.py" = ["E501"]  # long table strings and docstring lines
"scripts/pt_convention_report.py" = ["E501"]  # long table strings

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["brushstroke"]

[[tool.mypy.overrides]]
module = ["lpips", "lpips.*", "scipy.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: test requires a CUDA device (auto-skipped otherwise)",
    "slow: slow test, excluded from the default CI run",
]
