# M2 demos (scripts/make_m2_demos.py): Paint Transformer painting + animation of the three M1 demo inputs.
# Anything not listed inherits PaintPTConfig (configs/paint_pt.yaml) and AnimationConfig (configs/animation.yaml).
paint:
  seed: 0
  checkpoint: outputs/pt_long/seed2/latest.pt   # T-014 selected model; or data/raw/pt_official/model.pth (released weights)
  inference:
    final_layer: official
animation:
  renderer: pt
  formats: [gif]
  duration: 10.0
  hold: 2.0
  easing: by_level
  canvas_enabled: false      # PT canvas is black: the paper texture would only shade the strokes
  gif_width: 480
  gif_fps: 15
m1_dir: outputs/m1
panel: 384
