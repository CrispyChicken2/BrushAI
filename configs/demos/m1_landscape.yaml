# M1 demo 2: landscape. Everything not listed inherits the baseline config (brushstroke.baselines.optim.config
# defaults == configs/baseline_optim.yaml, enforced by a test) and the animation defaults (configs/animation.yaml).
name: m1_landscape
image_id: starry_night        # configs/experiments/images.yaml, docs/data_sources.md
paint:
  seed: 0
  cudnn_deterministic: true    # bitwise-reproducible GPU run at full speed (see docs/media/m1_results.md)
animation:
  formats: [mp4, gif]
  duration: 10.0
  hold: 2.0
  easing: by_level
  gif_width: 480
  gif_fps: 15
