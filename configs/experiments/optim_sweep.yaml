# T-009: sweep investigating the quality gap of the optimization baseline (hypotheses H1-H7).
# Regenerate everything with:  python -m scripts.exp_optim_sweep --config configs/experiments/optim_sweep.yaml
# (resumable: finished runs are read from out_dir; --stage NAME to run one stage; --worker K/N to shard).
base_config: configs/experiments/baseline_t005.yaml   # frozen T-005 defaults: the starting point of every variant
images_manifest: configs/experiments/images.yaml
image_dir: data/raw
out_dir: outputs/exp_optim
tables_path: docs/experiments/optim_sweep_tables.md
size: 512

# stroke schedules (levels = patch grids, strokes_per_patch = new strokes per patch at each level)
schedules:
  s1000: {levels: [1, 2, 3, 4, 6, 8, 12, 16], strokes_per_patch: [1, 1, 1, 1, 1, 2, 2, 2]}        # 994 strokes
  s2000: {levels: [1, 2, 3, 4, 6, 8, 12, 16, 20], strokes_per_patch: [1, 1, 1, 1, 1, 2, 3, 2, 2]}  # 1938 strokes
  fine_heavy: {levels: [1, 2, 4, 8, 16], strokes_per_patch: [1, 1, 1, 3, 3]}                       # 981
  coarse_heavy: {levels: [1, 2, 3, 4, 6, 8, 12], strokes_per_patch: [4, 4, 4, 4, 4, 4, 3]}        # 952
  uniform_per_level: {levels: [1, 2, 4, 6, 8, 12], strokes_per_patch: [170, 43, 11, 5, 3, 1]}     # 1034
  two_levels: {levels: [1, 4, 16], strokes_per_patch: [1, 12, 3]}                                   # 961
  fine_heavy_2000: {levels: [1, 2, 4, 8, 16, 20], strokes_per_patch: [1, 1, 1, 3, 4, 2]}           # 2037

# blur / resample reference floors computed on every image (what LPIPS an abstraction alone costs)
references: {blur_sigmas: [1.0, 2.0, 4.0], resample_factors: [2, 4, 8]}

stages:
  # ---- the T-005 default (reference point of every hypothesis) ------------------------------------
  - name: base
    description: T-005 defaults at ~1000 strokes
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    variants:
      - {name: default}
  - name: h1_iters
    description: "H1 under-optimization: steps per level"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    variants:
      - {name: iters50, overrides: [optim.iters=50]}
      - {name: iters200, overrides: [optim.iters=200]}
      - {name: iters400, overrides: [optim.iters=400]}
      - {name: iters800, overrides: [optim.iters=800]}
  - name: h2_alloc
    description: "H2 stroke allocation across levels at a fixed budget (~1000)"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    variants:
      - {name: fine_heavy, schedule: fine_heavy}
      - {name: coarse_heavy, schedule: coarse_heavy}
      - {name: uniform_per_level, schedule: uniform_per_level}
      - {name: uniform_per_level_density, schedule: uniform_per_level, overrides: [optim.init_size_mode=density]}
      - {name: two_levels, schedule: two_levels}
  - name: h3_init
    description: "H3 initialization and dead-stroke resampling"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    variants:
      - {name: error_power4, overrides: [optim.init_error_power=4.0]}
      - {name: error_power0_uniform_pos, overrides: [optim.init_error_power=0.0]}
      - {name: random_init, overrides: [optim.init_mode=random]}
      - {name: density_size, overrides: [optim.init_size_mode=density]}
      - {name: resample25, overrides: [optim.resample_every=25]}
      - {name: random_init_resample25, overrides: [optim.init_mode=random, optim.resample_every=25]}
  - name: h4_loss_optim
    description: "H4 loss terms and optimizer"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    variants:
      - {name: l1_only, overrides: [loss.lpips=0.0]}
      - {name: lpips0.3, overrides: [loss.lpips=0.3]}
      - {name: lpips1.0, overrides: [loss.lpips=1.0]}
      - {name: l1_ot0.1_snp, overrides: [loss.lpips=0.0, loss.ot=0.1]}
      - {name: lpips0.1_ot0.1, overrides: [loss.ot=0.1]}
      - {name: rmsprop_lr0.005, overrides: [optim.optimizer=rmsprop, optim.lr=0.005]}
      - {name: rmsprop_lr0.02, overrides: [optim.optimizer=rmsprop, optim.lr=0.02]}
      - {name: adam_lr0.01, overrides: [optim.lr=0.01]}
      - {name: adam_lr0.05, overrides: [optim.lr=0.05]}
      - {name: adam_lr0.1, overrides: [optim.lr=0.1]}
  - name: h5_brush
    description: "H5 brush kind"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    variants:
      - {name: flat, overrides: [brush.kind=flat]}
      - {name: round, overrides: [brush.kind=round]}
  - name: h6_finetune
    description: "H6 jointly fine-tuning earlier strokes"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    variants:
      - {name: finetune_all, overrides: [optim.finetune_all=true]}
      - {name: final_pass50, overrides: [optim.final_pass_iters=50]}
      - {name: final_pass150, overrides: [optim.final_pass_iters=150]}

  # ---- follow-up: where should the extra steps go? (compute per level: ~5 s per 100 steps at coarse levels,
  #      ~32 s at the finest level of s1000, so coarse levels are almost free) ------------------------
  - name: h1b_iters_alloc
    description: "H1b iteration allocation across levels at roughly equal cost (~260-300 s per image)"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    variants:
      - {name: uniform300, overrides: [optim.iters=300]}
      - {name: coarse_more, overrides: ["optim.iters_per_level=[800,800,800,800,800,400,200,100]"]}
      - {name: fine_more, overrides: ["optim.iters_per_level=[100,100,100,100,100,400,400,400]"]}
  - name: h1c_fine_iters
    description: "H1c how many extra steps at the finest levels (s1000)"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    delta_reference: h1b_iters_alloc/fine_more
    variants:
      - {name: fine_more2, overrides: ["optim.iters_per_level=[100,100,100,100,100,300,600,600]"]}
      - {name: fine_most, overrides: ["optim.iters_per_level=[100,100,100,100,100,200,600,1000]"]}
  - name: combo
    description: "combinations of the individually helpful changes, on top of `fine_more` (s1000)"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    delta_reference: h1b_iters_alloc/fine_more
    variants:
      - {name: fine_more_lr0.05, overrides: ["optim.iters_per_level=[100,100,100,100,100,400,400,400]", optim.lr=0.05]}
      - name: fine_more_fine_heavy
        schedule: fine_heavy
        overrides: ["optim.iters_per_level=[100,100,100,400,600]"]
      - {name: fine_more_final100, overrides: ["optim.iters_per_level=[100,100,100,100,100,400,400,400]", optim.final_pass_iters=100]}
      - {name: fine_more_finetune_all, overrides: ["optim.iters_per_level=[100,100,100,100,100,400,400,400]", optim.finetune_all=true]}
      - name: fine_more_all
        schedule: fine_heavy
        overrides: ["optim.iters_per_level=[100,100,100,400,600]", optim.lr=0.05, optim.final_pass_iters=100]
  - name: combo2
    description: "refining the best combination (fine_more + finetune_all), s1000"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    delta_reference: combo/fine_more_finetune_all
    variants:
      - name: fine_heavy_finetune_all
        schedule: fine_heavy
        overrides: ["optim.iters_per_level=[100,100,100,400,600]", optim.finetune_all=true]
      - {name: finetune_all_final100, overrides: ["optim.iters_per_level=[100,100,100,100,100,400,400,400]", optim.finetune_all=true, optim.final_pass_iters=100]}
      - {name: finetune_all_iters300, overrides: ["optim.iters_per_level=[100,100,100,100,100,300,300,300]", optim.finetune_all=true]}
      - {name: finetune_all_lrfactor1, overrides: ["optim.iters_per_level=[100,100,100,100,100,400,400,400]", optim.finetune_all=true, optim.finetune_lr_factor=1.0]}
  - name: combo3
    description: "is the LPIPS loss term still worth its cost once the optimization is long? (s1000)"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: s1000
    delta_reference: combo/fine_more_finetune_all
    variants:
      - {name: l1_fine_more_finetune_all, overrides: [loss.lpips=0.0, "optim.iters_per_level=[100,100,100,100,100,400,400,400]", optim.finetune_all=true]}
      - {name: l1_iters_x2_finetune_all, overrides: [loss.lpips=0.0, "optim.iters_per_level=[200,200,200,200,200,800,800,800]", optim.finetune_all=true]}
  - name: cand_1000
    description: "candidate new default at ~1000 strokes (fine_heavy schedule, long fine levels, joint fine-tuning, LPIPS 0.1)"
    images: [mona_lisa, great_wave]
    seeds: [0]
    schedule: fine_heavy
    delta_reference: combo/fine_more_finetune_all
    variants:
      - {name: cand1000, overrides: ["optim.iters_per_level=[100,100,100,400,600]", optim.finetune_all=true, optim.finetune_lr_factor=1.0]}
  - name: cand_2000
    description: "candidate new default at ~2000 strokes"
    images: [mona_lisa]
    seeds: [0]
    schedule: fine_heavy_2000
    delta_reference: final_2000/old
    variants:
      - {name: cand2000, overrides: ["optim.iters_per_level=[100,100,100,300,300,200]", optim.finetune_all=true, optim.finetune_lr_factor=1.0]}
  # ---- final confirmation: old (T-005) default vs new default, 5 images x 3 seeds ---------------------------
  - name: final_2000
    description: "final confirmation at ~2000 strokes: T-005 default (old) vs new default"
    images: [mona_lisa, starry_night, great_wave, pearl_earring, earth_apollo17]
    seeds: [0, 1, 2]
    schedule: s2000
    delta_reference: final_2000/old
    variants:
      - {name: old}
      - name: new
        schedule: fine_heavy_2000
        overrides: ["optim.iters_per_level=[100,100,100,300,300,150]", optim.finetune_all=true, optim.finetune_lr_factor=1.0]
  - name: final_1000
    description: "final confirmation at ~1000 strokes: T-005 default (old) vs new default"
    images: [mona_lisa, starry_night, great_wave, pearl_earring, earth_apollo17]
    seeds: [0, 1, 2]
    schedule: s1000
    delta_reference: final_1000/old
    variants:
      - {name: old}
      - name: new
        schedule: fine_heavy
        overrides: ["optim.iters_per_level=[100,100,100,400,600]", optim.finetune_all=true, optim.finetune_lr_factor=1.0]
